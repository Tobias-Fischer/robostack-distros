ros_distro: rolling

build_number: 29

mutex_package:
  version: "0.22.0"
  run_constraints:
    # ffmpeg (pulled in transitively by libopencv, needed by the whole image/gz
    # stack) only supports libprotobuf 7.35 via libopenvino-tensorflow-frontend
    # >=2026.3.0; older libopenvino/libopencv/ffmpeg builds still coexist in the
    # channel needing libprotobuf 6.x, so pin this directly rather than relying
    # on resolvo to find the compatible combination on its own. libopencv/
    # py-opencv are pinned too, since resolvo has shown trouble propagating the
    # openvino constraint transitively through ffmpeg on its own.
    - libopenvino-tensorflow-frontend >=2026.3.0
    - libopencv >=5.0.0
    - py-opencv >=5.0.0
    # Belt-and-suspenders for the same conflict: ffmpeg 8.1.2 builds that pull
    # in the protobuf-6-only openvino also coexist in the channel. Pinning
    # ffmpeg directly to major version 9 removes the ambiguity outright.
    - ffmpeg 9.*
    # libopencv 5.0.0 also depends on a *second*, separate openvino frontend
    # package (tensorflow-LITE-frontend, distinct from tensorflow-frontend
    # above) and every 5.0.0 build hardcodes it to the 2026.3.0.x line. Some
    # ffmpeg 9.0.1/9.0.2 builds instead need 2026.3.1, which conflicts --
    # constrain lite-frontend to the same range libopencv needs so resolvo
    # picks an ffmpeg 9.x build compatible with it.
    - libopenvino-tensorflow-lite-frontend >=2026.3.0,<2026.3.1.0a0

packages_skip_by_deps:
  - rplidar_ros
  - rviz_visual_tools

  # not yet released for rolling; rtabmap builds fine without it (disables the optional dependent feature)
  - libpointmatcher

  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp

  # mujoco_ros2_control_plugins needs EGL, which doesn't exist on Windows or macOS -- a genuine platform gap (unrelated to MuJoCo itself).
  - if: osx or win
    then:
      - mujoco_ros2_control_plugins

packages_remove_from_deps:

  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp


# Shared selections that rolling doesn't build (see also packages_skip_by_deps).

packages_deselect:
  - libpointmatcher
  - rplidar_ros
  - rviz_visual_tools
