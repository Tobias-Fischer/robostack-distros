extends: ../../shared/vinca.yaml
ros_distro: rolling
patch_dir: patch
rosdistro_snapshot: rosdistro_snapshot.yaml
rosdistro_additional_recipes: rosdistro_additional_recipes.yaml

build_number: 29

mutex_package:
  # new build without run_constraints (same version as the published ones)
  build_number: 30
  version: "0.22.0"

packages_exclude:

  # needs ros_image_to_qimage, which rolling doesn't have
  - rqt_image_overlay

packages_skip:
  - rplidar_ros
  - rviz_visual_tools

  # not yet released for rolling; rtabmap builds fine without it (disables the optional dependent feature)
  - libpointmatcher

  - if: osx or win
    then:
      - mujoco_ros2_control_plugins

