python_qt_binding:
  # sip <6.16: conda_build_config's variant pin doesn't apply transitively here; 6.16.x regressed ABI targeting for PyQt-based bindings.
  add_host: ["pyqt-builder", "qt6-main", "pyqt6", "sip <6.16"]
  add_run: ["pyqt-builder", "qt6-main", "pyqt6"]
qt_gui_cpp:
  # sip pinned directly for the same reason as python_qt_binding above.
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "pyqt-builder", "qt6-main", "pyqt6", "sip <6.16"]
  add_run: ["pyqt-builder", "qt6-main", "pyqt6"]
