# Settings of ros-kilted that differ from the other distributions
# (everything else is shared, see the README).
channel_name: robostack-kilted
upload_target: anaconda
# kilted has had no full rebuild on the shared pinning: keep the pins its published
# packages were built with (the run_constraints in its vinca.yaml match these).
pinning_overrides:
  python: [3.12.* *_cpython]
  libprotobuf: [6.33.5]
  protobuf: [6.33.5]
  vtk: [9.6.2]
  vtk_base: [9.6.2]
  libopencv: [4.13.0]
  libzenohc: [1.7.2]
  libzenohcxx: [1.7.2]
  tbb: ['2022']
  tbb_devel: ['2022']
  libxml2: ['2.14']
  libxml2_devel: ['2.14']
