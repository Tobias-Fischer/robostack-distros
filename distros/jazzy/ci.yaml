# Temporary controls for the pull-request build (.github/workflows/testpr.yaml).
#
# PR progress is cached by distribution, platform and a hash of its build inputs:
# recipes, patches, pins, shared tooling, and these controls. Changing any input
# starts a fresh cache; retries keep all successful outputs from that same epoch.
# No cache is restored across epochs. This deliberately invalidates all packages
# when an eviction list changes, including any dependents.
#
# Set this for a full rebuild PR; resetting it also starts a new cache epoch.
full_rebuild: false

# A temporary rebuild request. Changing this list starts a fresh cache epoch,
# without repeatedly deleting the newly rebuilt packages on subsequent attempts.
# Recipe and patch changes already invalidate the cache automatically.
# Entries document the ROS packages requested for rebuilding (names or globs).
#
# evict_cache:
#   - rosidl_generator_py     # one package: ros2-rosidl-generator-py-*.conda
#   - std-msgs                # dashes work too
#   - "roboplan*"             # a family of packages (quote globs)
#
# Reset temporary controls after merging.
evict_cache: []
