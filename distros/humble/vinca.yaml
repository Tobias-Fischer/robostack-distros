ros_distro: humble

build_number: 20

mutex_package:
  version: "0.10.0"
  run_constraints:
    - krb5 1.22.*

packages_skip_by_deps:

  - if: not linux
    then:
      - ament_cmake_xmllint
      - ament_xmllint
      - mimick_vendor
      - mujoco_ros2_control
      - mujoco_ros2_control_demos
      - mujoco_vendor
      - osrf_testing_tools_cpp
      - pendulum_control
      - performance_test_fixture
      - rclc_examples
      - rmw_connextdds
      - tlsf
      - tlsf_cpp

  # Gazebo Classic packages unavailable on Windows (libprotobuf pin conflict); robot_localization pulled in transitively via clearpath_control.
  - if: win
    then:
      - gz_ros2_control
      - gz_ros2_control_demos
      - robot_localization
      - ros_gz_sim
      - ros_gz_sim_demos
      - ros_ign_gazebo  # legacy-name counterpart of ros_gz_sim, not merely a dependent of it
      - ros_ign_gazebo_demos
      - ros_ign_image  # Modern gz-sim integration is unsupported on Humble Windows; see issue #68.
      - rttest
      - test_ros_gz_bridge
      - velodyne_gazebo_plugins  # links Gazebo Classic's Ogre libs; win-64 is missing OgreBites.lib

  - as2_behaviors_trajectory_generation  # nested FetchContent'd NLopt violates CMake 4's minimum version floor; too fragile to patch, skip for now

packages_remove_from_deps:

  - if: not linux
    then:
      - ament_cmake_xmllint
      - ament_xmllint
      - mimick_vendor
      - mujoco_ros2_control
      - mujoco_ros2_control_demos
      - mujoco_vendor
      - osrf_testing_tools_cpp
      - pendulum_control
      - performance_test_fixture
      - rclc_examples
      - rmw_connextdds
      - tlsf
      - tlsf_cpp

  # Strip these from any other recipe's deps too, matching the packages_skip_by_deps exclusion above (avoids dangling refs from direct dependents).
  - if: win
    then:
      - gz_ros2_control
      - gz_ros2_control_demos
      - robot_localization
      - ros_gz_sim
      - ros_gz_sim_demos
      - ros_ign_gazebo
      - ros_ign_gazebo_demos
      - ros_ign_image
      - rttest
      - test_ros_gz_bridge
      - velodyne_gazebo_plugins

# These are the packages that are built on all platforms (only a subset, to reduce maintainer load)


# Shared selections that humble doesn't build on some platforms (see also
# packages_skip_by_deps / packages_remove_from_deps).

packages_deselect:
  - if: not linux
    then:
      - mujoco_ros2_control
      - mujoco_ros2_control_demos
      - mujoco_vendor
      - osrf_testing_tools_cpp
      - rclc_examples
  - if: win
    then:
      - gz_ros2_control
      - gz_ros2_control_demos
      - robot_localization
