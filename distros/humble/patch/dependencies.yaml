autoware_trajectory:
  remove_host: ["ros-humble-tl-expected"]
  remove_run: ["ros-humble-tl-expected"]
  add_host: ["cpp-expected"]
  add_run: ["cpp-expected"]
aws_sdk_cpp_vendor:
  add_host: ["aws-sdk-cpp"]
  add_run: ["aws-sdk-cpp"]
backward_ros:
  # binutils linux-only: -liberty not found on macOS.
  add_host: ["${{ 'binutils' if linux }}", "${{ 'elfutils' if linux }}", "ros-humble-ament-cmake-libraries"]
behaviortree_cpp_v3:
  add_host: ["libboost-devel", "cppzmq"]
  add_run: ["libboost"]
cartographer:
  # Dummy package; drop unpinned lua/gflags, they conflict with the real cartographer's pins.
  remove_host: ["lua", "gflags"]
  remove_run: ["lua", "gflags"]
cartographer_ros:
  add_host: ["cartographer 2.*", "libboost-devel"]
console_bridge_vendor:
  add_host: ["console_bridge"]
  add_run: ["console_bridge"]
depthai:
  add_host: ["${{ 'elfutils' if linux }}"]
foxglove_bridge:
  add_host: ["ros-humble-ament-cmake"]
generate_parameter_library:
  remove_host: ["ros-humble-tl-expected"]
  remove_run: ["ros-humble-tl-expected"]
  add_host: ["cpp-expected"]
  add_run: ["cpp-expected"]
geometric_shapes:
  add_host: ["libboost-devel", "octomap"]
image_view:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # Depends on opencv with gui support, see  https://github.com/ros-perception/image_pipeline/blob/746268fcfd21b389bc39ae60bb6345a53c838558/image_view/src/stereo_view_node.cpp#L253
  add_run: ["libopencv * *qt6*"]
intra_process_demo:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
  # Depends on opencv with gui support, see https://github.com/ros2/demos/blob/8f361a1ece2daae54016959f3ea9ab2e7692ddbb/intra_process_demo/include/image_pipeline/image_view_node.hpp#L58
  add_run: ["libopencv * *qt6*"]
kdl_parser:
  # package.xml doesn't declare eigen3_cmake_module, but orocos_kdl_vendor's cmake needs it.
  add_host: ["ros-humble-eigen3-cmake-module"]
lbr_description:
  remove_run: ["ros-humble-gz-ros2-control"]
  add_run: ["${{ 'ros-humble-gz-ros2-control' if linux }}"]
lbr_ros2_control:
  add_host: ["ros-humble-kinematics-interface"]
  add_run: ["ros-humble-kinematics-interface"]
libg2o:
  add_host: ["${{ 'libglu' if linux }}", "${{ 'freeglut' if not osx }}"]
libstatistics_collector:
  add_host: ["ros-humble-yaml-cpp-vendor"]
mimick_vendor:
  add_build: ["vcstool"]
moveit_visual_tools:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
mrpt2:
  add_host: ["assimp", "octomap", "tinyxml2", "libboost-devel", "jsoncpp", "gtest", "libboost-python-devel", "libdc1394", "xorg-libxcomposite", "libftdi", "ros-humble-octomap"]
  add_run: ["assimp", "octomap", "tinyxml2", "libboost-devel", "jsoncpp", "gtest", "libboost-python-devel", "libdc1394", "xorg-libxcomposite", "libftdi", "ros-humble-octomap"]
  add_build: ["${{ cdt('libxcomposite-devel') if linux }}"]
nav2_constrained_smoother:
  add_host: ["${{ 'openblas' if win }}"]
nav2_util:
  add_host: ["libboost-devel"]
openvdb_vendor:
  add_host: ["openvdb"]
parameter_traits:
  remove_host: ["ros-humble-tl-expected"]
  remove_run: ["ros-humble-tl-expected"]
  add_host: ["cpp-expected"]
  add_run: ["cpp-expected"]
pcl_conversions:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "libboost-devel"]
plotjuggler:
  add_host: ["libxcb", "${{ 'elfutils' if linux }}", "ros-humble-ros-workspace", "git-lfs"]
polygon_rviz_plugins:
  add_host: ["libgl-devel"]
  add_run: ["libgl-devel"]
py_trees:
  add_host: ["poetry-core"]
py_trees_js:
  add_host: ["poetry-core"]
pybind11_json_vendor:
  add_host: ["pybind11_json"]
  add_run: ["pybind11_json"]
python_qt_binding:
  # pyside2 has no python 3.14 build; port to PyQt6 instead.
  remove_host: ["qt-main", "pyqt"]
  remove_run: ["qt-main", "pyqt"]
  # sip <6.16: 6.16.x regressed ABI targeting for PyQt-based bindings.
  add_host: ["pyqt-builder", "pep517", "qt6-main", "pyqt6", "sip <6.16"]
  add_run: ["pyqt-builder", "pep517", "qt6-main", "pyqt6"]
qt_gui:
  # Same PyQt6 port as python_qt_binding/qt_gui_cpp below.
  remove_host: ["qt-main", "pyqt"]
  remove_run: ["qt-main", "pyqt"]
  add_host: ["qt6-main", "pyqt6"]
  add_run: ["qt6-main", "pyqt6"]
qt_gui_cpp:
  # Ported to PyQt6, see patch/ros-humble-qt-gui-cpp.patch.
  remove_host: ["qt-main", "pyqt"]
  remove_run: ["qt-main", "pyqt"]
  add_build: ["${{ 'pyqt6' if (build_platform != target_platform) }}", "${{ 'qt6-main' if (build_platform != target_platform) }}"]
  # sip pinned directly for the same reason as python_qt_binding above.
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "pyqt-builder", "pep517", "qt6-main", "pyqt6", "sip <6.16"]
  add_run: ["pyqt-builder", "pep517", "qt6-main", "pyqt6"]
rcl:
  add_host: ["ros-humble-yaml-cpp-vendor"]
rcl_action:
  add_host: ["ros-humble-yaml-cpp-vendor"]
rclc:
  add_host: ["ros-humble-yaml-cpp-vendor"]
rclcpp:
  add_host: ["ros-humble-yaml-cpp-vendor"]
rclcpp_action:
  add_host: ["ros-humble-yaml-cpp-vendor"]
rclpy:
  add_host: ["typing_extensions"]
  add_run: ["typing_extensions"]
rmw_implementation:
  add_host:
  - "ros-humble-yaml-cpp-vendor"
  - "fmt"
ros_gz_sim:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
ros_ign_gazebo:
  add_host: ["ros-humble-std-msgs", "ros-humble-rclcpp", "${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
ros_ign_interfaces:
  add_host: ["ros-humble-rcl-interfaces"]
ros_image_to_qimage:
  # Same PyQt6 port as qt_gui_cpp/rqt_gui_cpp above (patch/ros-humble-ros-image-to-qimage.patch).
  remove_host: ["qt-main"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt6-main"]
rqt_gui_cpp:
  remove_host: ["qt-main"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt6-main"]
rqt_image_overlay:
  # Same PyQt6 port as qt_gui_cpp/rqt_gui_cpp above (patch/ros-humble-rqt-image-overlay.patch).
  remove_host: ["qt-main"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt6-main"]
rqt_image_overlay_layer:
  # Same PyQt6 port as qt_gui_cpp/rqt_gui_cpp above (patch/ros-humble-rqt-image-overlay-layer.patch).
  remove_host: ["qt-main"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt6-main"]
rqt_image_view:
  remove_host: ["qt-main"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "qt6-main"]
rqt_py_common:
  remove_host: ["qt-main"]
  add_host: ["qt6-main"]
rtabmap:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "ceres-solver", "${{ 'libdc1394' if not win }}", "libusb", "vtk"]
  remove_host: ["ros-humble-qt-gui-cpp"]
  remove_run: ["ros-humble-qt-gui-cpp"]
rviz_ogre_vendor:
  add_host: ["zlib", "freeimage", "freetype", "assimp", "zziplib", "pugixml", "${{ 'libglu' if linux }}"]
  add_build: ["vcstool"]
  add_run: ["assimp"]
slam_toolbox:
  add_build: ["${{ 'qt-main' if (build_platform != target_platform) }}"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
spatio_temporal_voxel_layer:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
spdlog_vendor:
  add_host: ["spdlog"]
  add_run: ["spdlog"]
tracetools:
  remove_host: ["pkg-config"]
uncrustify_vendor:
  add_host: ["uncrustify"]
  add_run: ["uncrustify"]
ur_moveit_config:
  add_host: ["ros-humble-rclpy"]
  add_run: ["ros-humble-rclpy"]
vision_msgs_rviz_plugins:
  add_build: ["${{ 'qt-main' if (build_platform != target_platform) }}"]
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
warehouse_ros_sqlite:
  add_host: ["ros-humble-sqlite3-vendor"]
  add_run: ["ros-humble-sqlite3-vendor"]
