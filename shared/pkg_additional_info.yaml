# Per-package build settings shared by every distribution; distros/<d>/pkg_additional_info.yaml
# adds its own and wins per key (e.g. build_number).
as2_behaviors_trajectory_generation:
  additional_cmake_args: '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
as2_platform_multirotor_simulator:
  additional_cmake_args:
    if: unix
    then: '-DCMAKE_CXX_FLAGS="-include cassert"'
aws_sdk_cpp_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
cartographer:
  generate_dummy_package_with_run_deps:
    dep_name: cartographer
    max_pin: 'x.x'
    # ROS uses a custom versioning scheme currently at 2.0.9004
    override_version: '2.0.0'
console_bridge_vendor:
  additional_cmake_args: "-DAMENT_VENDOR_POLICY=NEVER_VENDOR_IGNORE_SATISFIED_CHECK"
data_tamer_cpp:  # Remove once https://github.com/PickNikRobotics/data_tamer/pull/58 is merged and released
  additional_cmake_args: "-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"
