# vinca settings shared by every distribution; distros/<d>/vinca.yaml adds its own
# (lists are combined, other keys from the distribution win). See tools/robostack.py.
package_name_mode: both
# relative to this file; each distribution adds its own (see distros/<d>/vinca.yaml)
conda_index:
  - robostack.yaml
patch_dir: patch

# The distro mutex: every distribution sets its own version; its run_constraints
# replace the shared constraint on the same package and add others.
mutex_package:
  name: "ros2-distro-mutex"
  upper_bound: "x.x"
  run_constraints:
    - libboost 1.90.*
    - libboost-devel 1.90.*
    - pcl 1.15.1.*
    - gazebo 11.*
    - libprotobuf 7.35.1.*
    - vtk 9.7.0.*

# pixi used by the generated build workflows; keep in sync with .github/workflows.
setup_pixi_version: "0.11.0"
pixi_version: "0.81.0"
# Mapped to conda-forge in shared/robostack.yaml (tl_expected -> cpp-expected,
# sophus -> sophus). Where they are also ROS packages (humble, jazzy), vinca
# would otherwise build the ROS package under the conda-forge name, which shadows the
# conda-forge package (e.g. no tl-expected CMake config for rsl).
