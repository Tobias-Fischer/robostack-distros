# Dependency fixes shared by every distribution; distros/<d>/patch/dependencies.yaml
# adds its own and wins per package.
ament_package:
  add_host: ['importlib_resources']
behaviortree_cpp:
  add_host: ["libboost-devel", "cppzmq", "zeromq", "sqlite"]
  add_run: ["libboost"]
camera_calibration:
  # Depends on opencv with gui support, see https://github.com/ros-perception/image_pipeline/blob/746268fcfd21b389bc39ae60bb6345a53c838558/camera_calibration/src/camera_calibration/camera_calibrator.py#L286
  add_run: ["libopencv * *qt6*"]
dolly_ignition:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
embree_vendor:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "libpng", "libjpeg-turbo", "openimageio", "tbb", "tbb-devel", "embree"]
fmilibrary_vendor:
  add_host: ["fmilib"]
foonathan_memory_vendor:
  add_host: ["foonathan-memory"]
  add_run: ["foonathan-memory"]
force_torque_sensor_broadcaster:
  add_host: ["typeguard", "jinja2"]
franka_example_controllers:
  add_host: ["ros2-moveit-core"]
  add_run: ["ros2-moveit-core"]
franka_hardware:
  add_host: ["ros2-rclcpp-action", "ros2-rclcpp-components"]
  add_run: ["ros2-rclcpp-action", "ros2-rclcpp-components"]
franka_ign_ros2_control:
  add_host: ["ros2-urdf", "ros2-kdl-parser", "ros2-tf2-geometry-msgs", "ros2-tf2-eigen", "${{ 'libgl-devel' if linux }}"]
  add_run: ["ros2-urdf", "ros2-kdl-parser", "ros2-tf2-geometry-msgs", "ros2-tf2-eigen"]
franka_robot_state_broadcaster:
  add_host: ["ros2-visualization-msgs"]
  add_run: ["ros2-visualization-msgs"]
franka_semantic_components:
  add_host: ["ros2-urdf", "ros2-controller-interface"]
  add_run: ["ros2-urdf", "ros2-controller-interface"]
gazebo_ros:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
google_benchmark_vendor:
  add_host: ["benchmark"]
  add_run: ["benchmark"]
gscam:
  add_host: ["glib"]
ign_rviz:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
ign_rviz_common:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
ign_rviz_plugins:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
ignition_cmake2_vendor:
  add_host: ["libignition-cmake2"]
  add_run: ["libignition-cmake2"]
ignition_math6_vendor:
  add_host: ["libignition-math6"]
  add_run: ["libignition-math6"]
image_tools:
  # Depends on opencv with gui support, see https://github.com/ros2/demos/blob/8f361a1ece2daae54016959f3ea9ab2e7692ddbb/image_tools/src/showimage.cpp#L190
  add_run: ["libopencv * *qt6*"]
imu_calib:
  add_host: ["ros2-eigen3-cmake-module"]
  add_run: ["ros2-eigen3-cmake-module"]
libcurl_vendor:
  add_host: ["libcurl"]
  add_run: ["libcurl"]
libphidget22:
  add_host: ["libusb"]
libyaml_vendor:
  add_host: ["yaml-cpp", "yaml"]
  add_run: ["yaml-cpp", "yaml"]
livox_ros_driver2:
  add_host: ["livox-sdk2"]
moveit:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
moveit2_tutorials:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
moveit_setup_app_plugins:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
moveit_setup_assistant:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
moveit_setup_controllers:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
moveit_setup_core_plugins:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
moveit_setup_framework:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
moveit_setup_srdf_plugins:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
mujoco_ros2_control_plugins:
  add_host:
  - if: linux
    then: ["libegl-devel"]  # CMake finds OpenGL COMPONENTS EGL
mujoco_vendor:
  add_host: ["libmujoco"]  # conda-forge's MuJoCo (linux, osx, win) instead of the bundled build
nao_lola:
  add_host: ["libboost-devel"]
nav2_smac_planner:
  add_build: ["${{ 'llvm-openmp' if osx }}"]
  add_host: ["${{ 'llvm-openmp' if osx }}", "ompl", "libode"]
octomap_ros:
  add_host: ["octomap"]
octomap_rviz_plugins:
  add_host: ["octomap"]
ompl:
  add_host: ["ompl"]
open3d_conversions:
  # Open3D's own CMake config calls find_dependency(TBB), but conda-forge's
  # open3d package only depends on the runtime "tbb" lib, not "tbb-devel"
  # (which provides TBBConfig.cmake) -- add it explicitly so find_package(Open3D)
  # can resolve its own TBB dependency.
  add_host: ["tbb-devel"]
pcl_ros:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}", "libboost-devel"]
plotjuggler_ros:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
popf:
  add_host: ["perl"]
pybind11_vendor:
  add_host: ["pybind11"]
  add_run: ["pybind11"]
rmw_zenoh_cpp:
  add_host: ["libzenohc", "libzenohcxx"]
ros1_rosbag_storage_vendor:
  add_host: ["ros-noetic-roscpp", "ros-noetic-roslz4", "ros-noetic-rostest"]
  add_run: ["ros-noetic-roscpp", "ros-noetic-roslz4"]
ros_ign_gazebo_demos:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
rosbag2_bag_v2_plugins:
  add_host: ["ros-noetic-roscpp"]
rosx_introspection:
  add_host: ["rapidjson"]
rviz2:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
rviz_assimp_vendor:
  add_host: ["assimp"]
  add_run: ["assimp"]
rviz_rendering:
  add_host: ["glew"]
rviz_visual_testing_framework:
  add_host: ["${{ 'libgl-devel' if linux }}", "${{ 'libopengl-devel' if linux }}"]
sdl2_vendor:
  add_host: ["sdl2"]
  add_run: ["sdl2"]
sqlite3_vendor:
  add_host: ["sqlite"]
  add_run: ["sqlite"]
tvm_vendor:
  add_host: ["libblas", "openblas", "libcblas"]
velodyne_pointcloud:
  add_host: ["libboost-devel"]
yaml_cpp_vendor:
  add_host: ["yaml-cpp"]
  add_run: ["yaml-cpp"]
zenoh_cpp_vendor:
  add_host: ["libzenohc", "libzenohcxx"]
zstd_vendor:
  add_host: ["zstd", "${{ 'zstd-static' if not win }}"]
  add_run: ["zstd"]
