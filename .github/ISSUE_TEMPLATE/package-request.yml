name: Package request
description: Request a ROS package to be built by RoboStack
title: "Package request: PACKAGE_NAME"
labels: ["package-request"]
body:
  - type: markdown
    attributes:
      value: |
        robostack-bot replies with what building the package would involve (which
        distributions have it, how many packages would be built). A maintainer can then
        open the pull request with one comment (`@robostack-bot add-package ...`).
  - type: input
    id: package_name
    attributes:
      label: Package names
      description: ROS package names (as in rosdistro), comma separated, e.g. `foxglove_bridge, rqt_gauges`
      placeholder: PACKAGE_NAME
    validations:
      required: true
  - type: checkboxes
    id: distributions
    attributes:
      label: Distributions
      description: Leave empty for every distribution that has the package
      options:
        - label: rolling
        - label: lyrical
        - label: kilted
        - label: jazzy
        - label: humble
  - type: checkboxes
    id: operating_systems
    attributes:
      label: Operating System(s)
      options:
        - label: linux-64
        - label: linux-aarch64
        - label: osx-64
        - label: osx-arm64
        - label: win-64
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context (optional)
      description: Why you need the package, links to its repository, ...
