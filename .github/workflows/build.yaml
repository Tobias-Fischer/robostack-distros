jobs:
  stage_0_job_0:
    name: ros2-ros2cli ros2cli
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
    needs: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Disable git auto-maintenance
      run: git config --global maintenance.auto false && git config --global gc.auto
        0
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.11.0
      with:
        pixi-version: v0.81.0
        cache: 'true'
        log-level: v
        frozen: 'true'
    - name: Build ros2-ros2cli ros-humble-ros2cli
      env:
        CURRENT_RECIPES: ros2-ros2cli ros-humble-ros2cli
        BUILD_TARGET: linux-aarch64
      run: |
        export CI=github
        export GIT_BRANCH=${GITHUB_REF_NAME}
        export FEEDSTOCK_NAME=${GITHUB_REPOSITORY##*/}
        .scripts/build_unix.sh --target $BUILD_TARGET
    permissions:
      id-token: write
      contents: read
      attestations: write
name: build
run-name: humble linux-aarch64
concurrency:
  group: build-humble-linux-aarch64
  cancel-in-progress: false
on:
  push:
    branches:
    - buildbranch_humble_linux_aarch64
env:
  ROBOSTACK_DISTRO: humble
  # optional repository variable: upload to this prefix.dev channel instead
  # (e.g. a test channel), or 'none' to only build
  ROBOSTACK_UPLOAD_CHANNEL: ${{ vars.ROBOSTACK_UPLOAD_CHANNEL }}
