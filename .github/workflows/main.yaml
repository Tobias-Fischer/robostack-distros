# After a merge: regenerate the staged build workflows of every distribution the
# merge touched, one job and one build branch per distribution and platform
# (buildbranch_<distro>_<platform>, each with its workflow in .github/workflows/build.yaml).
# Pushing them starts the builds, which upload to each distribution's channel.
#
# Pushing workflow files needs the robostack-bot app (or secrets.GHA_PAT); without a
# token, or with dry_run, the generated workflows are only uploaded as an artifact.
name: Generate build branches

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      distros:
        description: Space-separated distributions (default all)
        required: false
      dry_run:
        description: Only upload the generated workflows as an artifact
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.plan.outputs.distros }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          SELECTED: ${{ inputs.distros }}
        run: |
          if [ -n "$SELECTED" ]; then
            distros=$(python3 -c 'import json,os; print(json.dumps(os.environ["SELECTED"].split()))')
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            distros=$(python3 tools/robostack.py changed-distros --base "$BEFORE")
          else
            distros=$(python3 tools/robostack.py changed-distros --base HEAD --all)
          fi
          echo "distros=$distros" | tee -a "$GITHUB_OUTPUT"

  build-branches:
    needs: plan
    if: needs.plan.outputs.distros != '[]'
    runs-on: ubuntu-latest
    name: ${{ matrix.distro }} ${{ matrix.platform }}
    # one generation per build branch at a time: two merges in quick succession must
    # not push the same build branch in parallel (a newer pending run replaces an older one)
    concurrency:
      group: generate-${{ matrix.distro }}-${{ matrix.platform }}
      cancel-in-progress: false
    # one job per distribution and platform, so the platforms are generated in parallel
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.plan.outputs.distros) }}
        platform: [linux-64, linux-aarch64, osx-64, osx-arm64, win-64]
    env:
      DISTRO: ${{ matrix.distro }}
      PLATFORM: ${{ matrix.platform }}
      # while uploads go to a test channel, packages already there aren't built again
      ROBOSTACK_UPLOAD_CHANNEL: ${{ vars.ROBOSTACK_UPLOAD_CHANNEL }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Bot token (pushing workflow files needs more than GITHUB_TOKEN)
        id: app
        if: vars.ROBOSTACK_BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ROBOSTACK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ROBOSTACK_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      # git auto-maintenance can leave a lock file in the git clones pixi caches
      # (e.g. vinca's), which breaks every later run restoring that cache
      - name: Disable git auto-maintenance
        run: git config --global maintenance.auto false && git config --global gc.auto 0 && git config --global core.longpaths true
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true  # the lock file must match pixi.toml
          pixi-version: v0.81.0
          # one job saves the shared pixi environment cache (same key for all)
          cache-write: ${{ matrix.distro == fromJSON(needs.plan.outputs.distros)[0] && matrix.platform == 'linux-64' }}
      - name: Generate and push the build branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ steps.app.outputs.token || secrets.GHA_PAT }}
        run: |
          set -e
          PUSH=true
          if [ "$DRY_RUN" == "true" ]; then PUSH=false; fi
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::warning::No robostack-bot app or GHA_PAT: build branches are not pushed, see the artifact."
            PUSH=false
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p "$RUNNER_TEMP/workflows"
          # vinca fetches package.xml files from GitHub; retry on network errors
          retry() { for attempt in 1 2 3; do "$@" && return 0; echo "attempt ${attempt} failed: $*" >&2; sleep 15; done; return 1; }
          retry pixi run -v rs "$DISTRO" generate-recipes --platform "$PLATFORM"
          # everything already built: no workflow to generate (vinca-gha takes minutes)
          if ! compgen -G "distros/$DISTRO/work/recipes/*/recipe.yaml" > /dev/null; then
            echo "$DISTRO $PLATFORM: nothing to build"
            exit 0
          fi
          retry pixi run -v rs "$DISTRO" gha --platform "$PLATFORM" --batch-size 25
          if [ ! -f .github/workflows/build.yaml ]; then
            echo "$DISTRO $PLATFORM: nothing to build"
            exit 0
          fi
          cp .github/workflows/build.yaml "$RUNNER_TEMP/workflows/build_${DISTRO}_${PLATFORM}.yaml"
          if [ "$PUSH" == "true" ]; then
            branch="buildbranch_${DISTRO}_${PLATFORM//-/_}"
            git add -f . ':!.pixi'
            git commit -qm "Build files for $DISTRO $PLATFORM $(date '+%Y-%m-%d-%H%M')"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$branch" --force
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: build-workflows-${{ matrix.distro }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/workflows
          if-no-files-found: ignore
