# Pull-request build: only the distributions a PR touches are built
# (a change outside distros/ affects all of them), on all five platforms.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      distros:
        description: Space-separated distributions to build (default all)
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  # No git auto-maintenance: it can leave a lock file in the git clones pixi keeps in
  # its cache (e.g. vinca's), which breaks every later run restoring that cache.
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: maintenance.auto
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: gc.auto
  GIT_CONFIG_VALUE_1: "0"
  PYTHONIOENCODING: utf-8
  SAVE_CACHE_AS_ARTIFACT: 'true'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.plan.outputs.distros }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Which distributions changed
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SELECTED: ${{ inputs.distros }}
        run: |
          # plain python + PyYAML of the runner image; no pixi needed for this
          if [ -n "$SELECTED" ]; then
            distros=$(python3 -c 'import json,os; print(json.dumps(os.environ["SELECTED"].split()))')
          elif [ -n "$BASE" ]; then
            distros=$(python3 tools/robostack.py changed-distros --base "$BASE")
          else
            distros=$(python3 tools/robostack.py changed-distros --base HEAD --all)
          fi
          echo "distros=$distros" | tee -a "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          frozen: true
          pixi-version: v0.81.0
          cache-write: false  # the build jobs save the pixi environment cache
      - name: Sanity checks (every distribution assembles, generated files up to date, sorted)
        run: pixi run rs check

  build:
    needs: plan
    if: needs.plan.outputs.distros != '[]'
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.plan.outputs.distros) }}
        target:
          - { os: ubuntu-latest, platform: linux-64 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { os: macos-15-intel, platform: osx-64 }
          - { os: macos-15, platform: osx-arm64 }
          - { os: windows-2022, platform: win-64 }
    name: ${{ matrix.distro }} ${{ matrix.target.platform }}
    runs-on: ${{ matrix.target.os }}
    env:
      DISTRO: ${{ matrix.distro }}
      PLATFORM: ${{ matrix.target.platform }}
      # rattler-build writes to distros/<d>/work/output, or to CONDA_BLD_PATH (win-64)
      CACHE_DIR: ${{ matrix.target.platform == 'win-64' && 'C:/bld/win-64' || format('distros/{0}/work/output/{1}', matrix.distro, matrix.target.platform) }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        fetch-depth: 0

    - uses: prefix-dev/setup-pixi@v0.11.0
      with:
        frozen: true
        pixi-version: v0.81.0
        # every distribution's job on a platform has the same cache key; let one
        # of them save it instead of all racing ("Unable to reserve cache")
        cache-write: ${{ matrix.distro == fromJSON(needs.plan.outputs.distros)[0] }}

    - name: Windows workarounds (short build path, long paths, PATH and SDK clean-up)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "CONDA_BLD_PATH=C:\bld\" | Out-File -FilePath $env:GITHUB_ENV -Append
        New-Item -ItemType Directory -Force -Path C:\bld | Out-Null
        New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        Remove-Item -Recurse -Force C:\Strawberry -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force "C:\Program Files (x86)\Windows Kits\10\Include\10.0.17763.0" -ErrorAction SilentlyContinue

    - name: Clean up PATH
      if: runner.os == 'Windows'
      uses: egor-tensin/cleanup-path@v5
      with:
        dirs: 'C:\Program Files\Git\usr\bin;C:\Program Files\Git\bin;C:\Program Files\Git\cmd;C:\Program Files\Git\mingw64\bin'

    - name: Disable git auto-maintenance in source caches
      shell: bash -l {0}
      run: git config --global maintenance.auto false

    - name: Generate recipes
      shell: bash -l {0}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        for attempt in 1 2 3; do
          if pixi run -v rs "$DISTRO" generate-recipes --platform "$PLATFORM" -n; then break; fi
          if [[ "${attempt}" == "3" ]]; then echo "Recipe generation failed after 3 attempts" >&2; exit 1; fi
          echo "Recipe generation attempt ${attempt} failed; retrying..." >&2
          sleep 15
        done

    - name: Check patches
      shell: bash -l {0}
      run: |
        pixi run rs "$DISTRO" check-orphaned-patches
        pixi run rs "$DISTRO" check-patches

    - name: Restore build cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CACHE_DIR }}
        key: ${{ runner.os }}-${{ matrix.distro }}-${{ matrix.target.platform }}-pr-${{ github.event.pull_request.number }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.distro }}-${{ matrix.target.platform }}-pr-${{ github.event.pull_request.number }}-

    # Temporary rebuild controls live in distros/<distro>/ci.yaml.
    - name: Apply ci.yaml cache controls
      shell: bash -l {0}
      run: |
        pixi run python tools/ci_config.py --cache-dir "$CACHE_DIR" --config "distros/$DISTRO/ci.yaml" --vinca "distros/$DISTRO/vinca.yaml"
        mkdir -p "$CACHE_DIR"
        pixi run rattler-index fs "$CACHE_DIR/.." --force

    - name: See packages restored by cache
      shell: bash -l {0}
      run: |
        shopt -s nullglob
        packages=("$CACHE_DIR"/*.conda)
        echo "${#packages[@]} packages restored from the cache"
        for package in "${packages[@]}"; do basename "$package"; done

    - name: Estimate the build
      shell: bash -l {0}
      run: pixi run python tools/ci_estimate.py --recipes "distros/$DISTRO/work/recipes" --cache-dir "$CACHE_DIR" --platform "$PLATFORM"

    - name: Build recipes
      id: build-recipes
      shell: bash -l {0}
      run: |
        set +e
        extra=()
        # shorter work dirs for MAX_PATH on Windows
        [ "$PLATFORM" == "win-64" ] && extra+=(--no-build-id)
        pixi run rs "$DISTRO" build --target-platform "$PLATFORM" "${extra[@]}" 2>&1 | tee rattler-build.log
        status=${PIPESTATUS[0]}
        echo "exit-code=${status}" >> "$GITHUB_OUTPUT"
        exit "$status"

    - name: Summarize build result
      if: always()
      shell: bash -l {0}
      run: |
        pixi run python tools/summarize_rattler_build.py --log rattler-build.log \
          --platform "$DISTRO $PLATFORM" --outcome "${{ steps.build-recipes.outcome }}" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: build-log-${{ matrix.distro }}-${{ matrix.target.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: rattler-build.log
        if-no-files-found: warn
        retention-days: 7

    - name: Drop the package a cancellation may have cut short
      # Cancelling can kill the compiler while the build script carries on, and
      # rattler-build then packages an empty build (seen on Windows); the newest
      # artifact is the only one that can be affected.
      if: ${{ always() && steps.build-recipes.outcome == 'cancelled' }}
      shell: bash -l {0}
      run: |
        newest=$(ls -t "$CACHE_DIR"/*.conda 2>/dev/null | head -1)
        if [ -n "$newest" ]; then echo "Removing $newest"; rm -f "$newest"; fi

    - name: Save build cache
      if: ${{ always() && contains(fromJSON('["success","failure","cancelled"]'), steps.build-recipes.outcome) }}
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CACHE_DIR }}
        key: ${{ runner.os }}-${{ matrix.distro }}-${{ matrix.target.platform }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Generate the staged build workflows (catches post-merge problems)
      shell: bash -l {0}
      run: |
        for attempt in 1 2 3; do
          if pixi run rs "$DISTRO" gha --platform "$PLATFORM" --batch-size 25; then break; fi
          if [[ "${attempt}" == "3" ]]; then echo "Workflow generation failed after 3 attempts" >&2; exit 1; fi
          echo "Workflow generation attempt ${attempt} failed; retrying..." >&2
          sleep 15
        done

  # One stable check for branch protection / auto-merge: the build matrix differs
  # from PR to PR, so require this job instead of the individual builds.
  all-green:
    name: All green
    needs: [plan, check, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded (or had nothing to build)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
